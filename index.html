<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Backbone Hierarchy</title>
  <meta name="description" content="The cool webpage is still being built. Download Backbone Hierarchy now." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    /* ── Light mode (default) ── */
    :root {
      --bg: #f5f5f7;
      --text: #1a1a2e;
      --muted: #555570;
      --btn-bg: #1a1a2e;
      --btn-color: #f5f5f7;
      --btn-hover-bg: #2e2e50;
      --link-color: #555570;
      --link-hover: #1a1a2e;
    }

    /* ── Dark mode ── */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0f;
        --text: #e8e8f0;
        --muted: #a0a8c0;
        --btn-bg: #ffffff;
        --btn-color: #0a0a0f;
        --btn-hover-bg: #d8d8f0;
        --link-color: #a0a8c0;
        --link-hover: #ffffff;
      }
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      padding: 1.25rem 2rem;
    }

    .twitter-link {
      color: var(--link-color);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      transition: color 0.2s ease;
    }

    .twitter-link:hover {
      color: var(--link-hover);
    }

    /* ── Main ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
      text-align: center;
    }

    .tagline {
      font-size: clamp(1.1rem, 3vw, 1.4rem);
      font-weight: 400;
      color: var(--muted);
      max-width: 480px;
      line-height: 1.6;
    }

    /* ── Download Button ── */
    .download-btn {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: var(--btn-bg);
      color: var(--btn-color);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 8px;
      letter-spacing: 0.02em;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .download-btn:hover {
      background: var(--btn-hover-bg);
      transform: translateY(-1px);
    }

    .download-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <main>
    <p class="tagline">The cool webpage is still being built, for now just download Backbone Hierarchy</p>
    <a href="https://github.com/vbulgariangymratt-afk/Backbone-s-minimal-webpage/releases/latest/download/Backbone.zip" class="download-btn">Download</a>
    <a href="https://x.com/vz_warhead" target="_blank" rel="noopener noreferrer" class="twitter-link">My X/Twitter: vz_warhead</a>
  </main>

</body>
</html>
